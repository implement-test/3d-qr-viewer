<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 모델 QR 목록</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="config.js"></script> 
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; }
        img { width: 150px; height: 150px; }
    </style>
</head>
<body>
    <h1>Supabase 모델 목록</h1>
    <div id="loading">로딩 중...</div>
    <div class="grid" id="file-list"></div>

<script>
        console.log("👉 1. 스크립트가 시작되었습니다.");

        // 1. Config 파일 로드 확인
        if (!window.SupabaseConfig) {
            console.error("❌ config.js 파일이 로드되지 않았습니다. 파일 위치를 확인해주세요!");
            alert("설정(config.js)을 불러오지 못했습니다.");
        } else {
            console.log("👉 2. 설정값을 성공적으로 불러왔습니다:", window.SupabaseConfig);
        }

        const { url, key, bucket } = window.SupabaseConfig;

        // 2. Supabase 클라이언트 생성 확인
        let client;
        try {
            client = window.supabase.createClient(url, key);
            console.log("👉 3. Supabase 클라이언트 생성 완료");
        } catch (err) {
            console.error("❌ Supabase 클라이언트 생성 실패:", err);
        }

        // 현재 도메인(https://...) 뒤에 강제로 viewer.html을 붙임
		const BASE_URL = `${window.location.origin}/viewer.html`;

        async function loadFiles() {
            console.log(`👉 4. '${bucket}' 버킷에서 파일 목록을 요청합니다...`);
            
            // 3. 데이터 요청 확인
            const { data, error } = await client.storage.from(bucket).list();

            if (error) {
                console.error("❌ Supabase 에러 발생:", error);
                alert(`데이터를 가져오는데 실패했습니다.\n에러: ${error.message}`);
                return;
            }

            console.log("👉 5. 받아온 파일 데이터:", data);

            if (!data || data.length === 0) {
                console.warn("⚠️ 파일 목록이 비어있습니다. 버킷에 파일이 있는지 확인해주세요.");
                alert("버킷에 파일이 없습니다.");
                document.getElementById('loading').innerText = "파일이 없습니다.";
                return;
            }

            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('file-list');

            let count = 0;
            for (const file of data) {
                // .emptyFolderPlaceholder 같은 시스템 파일은 무시
                if (file.name.startsWith('.')) continue;

                console.log(`👉 파일 처리 중: ${file.name}`);
                count++;

                const viewerUrl = `${BASE_URL}?file=${encodeURIComponent(file.name)}`;
                const qrUrl = await QRCode.toDataURL(viewerUrl);

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${file.name}</h3>
                    <img src="${qrUrl}" alt="QR">
                    <br>
                    <a href="${viewerUrl}" target="_blank">뷰어 확인</a>
                `;
                container.appendChild(card);
            }
            console.log(`👉 총 ${count}개의 파일 QR 생성 완료`);
        }
        loadFiles();
    </script>
</body>
</html>
