<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="config.js"></script>
    <style>
        body, html { margin: 0; height: 100%; overflow: hidden; background: #eee; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <model-viewer 
        id="viewer"
        src="" 
        
        autoplay 
        animation-name="*"
        
        environment-image="neutral" 
        tone-mapping="commerce"
        exposure="1"
        shadow-intensity="1"
        
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls>
    </model-viewer>

    <script>
        const { url, bucket } = window.SupabaseConfig;

        const params = new URLSearchParams(window.location.search);
        const fileName = params.get('file');

        if (fileName) {
            // Supabase 공개 URL 조합
            const publicUrl = `${url}/storage/v1/object/public/${bucket}/${fileName}`;
            document.getElementById('viewer').src = publicUrl;
        } else {
            alert('잘못된 접근입니다.');
        }
    </script>
</body>
</html>
