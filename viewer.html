<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="config.js"></script>
    <style>
        /* 페이지 스크롤 및 튀는 현상 방지 */
        body, html { 
            margin: 0; 
            height: 100%; 
            overflow: hidden; 
            background: #333; 
            font-family: sans-serif;
            touch-action: none; /* 브라우저 기본 터치 동작 차단 */
        }
        
        model-viewer { 
            width: 100%; 
            height: 100%;
            /* 뷰어 내부에서도 터치 충돌 방지 */
            touch-action: none; 
            outline: none;
        }

        .controls {
            position: absolute;
            bottom: 30px; /* 위치를 조금 더 올림 */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            overflow-x: auto;
            max-width: 90%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            z-index: 100;
            /* 버튼 쪽에서는 스크롤이 가능해야 하므로 auto로 설정 */
            touch-action: pan-x; 
        }

        .anim-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 10px 20px; /* 버튼 크기 키움 (터치하기 편하게) */
            border-radius: 15px;
            font-size: 15px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            font-weight: 500;
        }

        .anim-btn.active {
            background: #4CAF50;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .controls::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <model-viewer 
        id="viewer"
        src="" 
        autoplay 
        environment-image="neutral" 
        tone-mapping="commerce"
        exposure="1"
        shadow-intensity="1"
        ar 
        camera-controls 
        touch-action="none"
        interpolation-decay="200"
        disable-tap
        min-camera-orbit="auto auto 5%"
        max-camera-orbit="auto auto 150%">
    </model-viewer>

    <div class="controls" id="anim-controls" style="display: none;"></div>

    <script>
        const { url, bucket } = window.SupabaseConfig;
        const viewer = document.getElementById('viewer');
        const controls = document.getElementById('anim-controls');

        const params = new URLSearchParams(window.location.search);
        const fileName = params.get('file');

        if (fileName) {
            const publicUrl = `${url}/storage/v1/object/public/${bucket}/${fileName}`;
            viewer.src = publicUrl;
        } else {
            alert('잘못된 접근입니다.');
        }

        viewer.addEventListener('load', () => {
            const animations = viewer.availableAnimations;
            
            if (animations.length === 0) {
                controls.style.display = 'none';
                return;
            }

            controls.style.display = 'flex';
            controls.innerHTML = '';

            viewer.animationName = animations[0];

            animations.forEach((animName, index) => {
                const btn = document.createElement('button');
                btn.className = 'anim-btn';
                btn.innerText = animName;
                
                if (index === 0) btn.classList.add('active');

                btn.onclick = () => {
                    viewer.animationName = animName; 
                    document.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                controls.appendChild(btn);
            });
        });
    </script>
</body>
</html>
